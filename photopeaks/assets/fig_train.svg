<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1050" width="100%" role="img" aria-label="Conditional photo recipes and separate validation evidence">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/></marker>
  <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2a23b"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b39a"/></marker>
  <marker id="arrowMag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9785a"/></marker>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#191919"/><stop offset="1" stop-color="#191919"/></linearGradient>
</defs>
<style>
  .flow { stroke-dasharray: 7 7; animation: dash 1.6s linear infinite; }
  .flowSlow { stroke-dasharray: 7 7; animation: dash 3.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 3.4s ease-in-out infinite; }
  .pulse2 { animation: pulse 3.4s ease-in-out .8s infinite; }
  .pulse3 { animation: pulse 3.4s ease-in-out 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
</style>
<rect y="0" width="1680" height="1050" fill="url(#bgGrad)"/>
<text x="50" y="55" font-size="15" fill="#e2a23b" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">A · CONDITIONAL RECIPE</text>
<text x="50" y="92" font-size="26" fill="#edebe7" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">同一张照片，不同条件，独立渲染</text>
<rect x="50" y="145" width="290" height="170" rx="14" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1.6" opacity="1.0"/>
<text x="195" y="188" font-size="21" fill="#edebe7" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">输入照片</text>
<text x="195" y="225" font-size="15" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">中性解码 / 已有专家成片</text>
<text x="195" y="262" font-size="15" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">同图配对 · 照片级划分</text>
<rect x="50" y="345" width="290" height="110" rx="14" fill="#1f1f1f" stroke="#e2a23b" stroke-width="1.6" opacity="1.0"/>
<text x="195" y="385" font-size="18" fill="#e2a23b" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">离散专家条件 A–E</text>
<text x="195" y="420" font-size="14" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">用于监督，不预设固定风格</text>
<rect x="440" y="145" width="340" height="310" rx="14" fill="#1f1f1f" stroke="#c9785a" stroke-width="1.6" opacity="1.0"/>
<text x="610" y="205" font-size="24" fill="#edebe7" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">参数预测器</text>
<text x="610" y="254" font-size="18" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">缩略图 + 条件</text>
<text x="610" y="303" font-size="16" fill="#edebe7" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">比较：滑块 / 滑块 + 残差 LUT</text>
<text x="610" y="352" font-size="15" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">比较：中性输入 / 混合成片输入</text>
<text x="610" y="407" font-size="17" fill="#c9785a" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">配对重建监督</text>
<line x1="342" y1="230" x2="438" y2="230" stroke="#4a4a4a" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/>
<path d="M 342 400 C 400 400, 390 365, 438 365" fill="none" stroke="#e2a23b" stroke-width="1.6" class="flow" marker-end="url(#arrowCyan)"/>
<rect x="860" y="145" width="320" height="170" rx="14" fill="#1f1f1f" stroke="#c7b08a" stroke-width="1.6" opacity="1.0"/>
<text x="1020" y="187" font-size="21" fill="#edebe7" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">调色滑块</text>
<text x="1020" y="224" font-size="16" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">白平衡 · 曝光 · 曲线</text>
<text x="1020" y="261" font-size="16" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">饱和度 · 混色</text>
<rect x="860" y="345" width="320" height="110" rx="14" fill="#1f1f1f" stroke="#c7b08a" stroke-width="1.6" opacity="1.0"/>
<text x="1020" y="385" font-size="19" fill="#c7b08a" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">可选：残差 3D LUT</text>
<text x="1020" y="420" font-size="15" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">有界颜色映射 · 平滑约束</text>
<line x1="782" y1="230" x2="858" y2="230" stroke="#c7b08a" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/>
<path d="M 782 365 C 825 365, 820 400, 858 400" fill="none" stroke="#c7b08a" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/>
<rect x="1260" y="145" width="370" height="310" rx="14" fill="#1f1f1f" stroke="#a9b39a" stroke-width="1.6" opacity="1.0"/>
<text x="1445" y="205" font-size="24" fill="#edebe7" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">原图上独立渲染</text>
<text x="1445" y="254" font-size="18" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">每个条件生成一个候选</text>
<text x="1445" y="303" font-size="18" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">保留原图与强度控制</text>
<text x="1445" y="352" font-size="22" fill="#a9b39a" text-anchor="middle" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">用户选择</text>
<text x="1445" y="407" font-size="16" fill="#8a867f" text-anchor="middle" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">完整配方回放 · XMP 近似</text>
<line x1="1182" y1="230" x2="1258" y2="230" stroke="#a9b39a" stroke-width="1.6" class="flow" marker-end="url(#arrowGreen)"/>
<path d="M 1182 400 C 1220 400, 1220 365, 1258 365" fill="none" stroke="#a9b39a" stroke-width="1.6" class="flow" marker-end="url(#arrowGreen)"/>
<rect x="50" y="500" width="1580" height="95" rx="14" fill="#1c1c1c" stroke="#4a4a4a" stroke-width="1.6" opacity="1.0"/>
<text x="78" y="539" font-size="19" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">颜色映射保留像素位置；仍需检查截断、色带与细节损失。</text>
<text x="78" y="573" font-size="17" fill="#8a867f" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">参数缩放可复现，但不保证感知线性；多条件输出有差异，也不等于多个候选都好看。</text>
<text x="50" y="660" font-size="15" fill="#e2a23b" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">B · SEPARATE EVIDENCE</text>
<text x="50" y="697" font-size="26" fill="#edebe7" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">调色能力、条件遵循与用户偏好分别验证</text>
<rect x="50" y="740" width="760" height="240" rx="14" fill="#1f1f1f" stroke="#c7b08a" stroke-width="1.6" opacity="1.0"/>
<text x="75" y="781" font-size="22" fill="#c7b08a" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">重建与可控性</text>
<text x="75" y="826" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">PSNR / 色差：目标重建，不等于审美质量</text>
<text x="75" y="862" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">匹配 / 错配条件：检查是否真的使用条件</text>
<text x="75" y="898" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">恒等与强度探针：检查不必要的改动</text>
<text x="75" y="934" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">同图候选差异：只衡量分离，不能独立追求</text>
<rect x="870" y="740" width="760" height="240" rx="14" fill="#1f1f1f" stroke="#a9b39a" stroke-width="1.6" opacity="1.0"/>
<text x="895" y="781" font-size="22" fill="#a9b39a" text-anchor="start" font-weight="700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">独立质量与覆盖</text>
<text x="895" y="826" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">独立 JPEG：手机、相机与已有后期</text>
<text x="895" y="862" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">同预算对照：滑块、混合 LUT 与已发表方法</text>
<text x="895" y="898" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">人类盲评：各候选质量、可选性、保留原图</text>
<text x="895" y="934" font-size="17" fill="#edebe7" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">按照片统计区间，固定划分与选模规则</text>
<text x="50" y="1025" font-size="15" fill="#8a867f" text-anchor="start" font-weight="normal" font-family="'Segoe UI','Microsoft YaHei',sans-serif">训练目标与验证路径；正式质量结果待评测。FiveK：Bychkovsky et al., CVPR 2011。</text>
</svg>